[package]
name = "greetd"
version = "0.10.3"
authors = ["Kenny Levinsen"]
edition = "2018"
license = "GPL-3.0-only"
homepage = "https://kl.wtf/projects/greetd"
repository = "https://git.sr.ht/~kennylevinsen/greetd/"

[features]
debug = []

[dependencies]
nix = { version = "0.28", features = ["ioctl", "signal", "user", "fs", "mman"] }
# Zainium: elevate-pam's own native Rust API, not the C-ABI/dlopen
# pam-sys crate -- no runtime libpam.so.0 SONAME/dlopen/$PATH lookup at
# all anymore, greetd links straight against elevate-pam itself.
# legacy_pamd (off by default upstream) is required: every PAM service
# file in this whole project (this crate's own etc/pam.d/greetd, plus
# cosmic-greeter, login, sudo, ...) is a classic /etc/pam.d/<service>
# file, not elevate-pam's own native TOML format.
#
# default-features off: elevate-pam's default set pulls in
# elevate_crypto (blake3/ed25519-dalek/curve25519-dalek) for nothing --
# greetd never touches crypto itself, that's the separately-built PAM
# module .so's job (pam_unix.so etc, dlopen'd at runtime). Pulling that
# whole dependency graph in here was also crashing curve25519-dalek's
# build script under this CI's environment. builtin_modules is dropped
# too for the same reason (statically compiles module logic in, which
# dynload + the real .so modules already covers).
#
# builtin_modules is back on: the x86_64-unknown-linux-musl build is a
# static-pie, where musl's dlopen() always fails, so the builtins are the
# only modules it has. It doesn't pull in elevate_crypto; pam_unix falls
# back to crypt(3) for the $6$ hashes in shadow.
elevate-pam = { git = "https://github.com/Zainium-Dynamics/elevate-pam.git", rev = "886a1c93c48276ad8600e88ec129c70976138154", default-features = false, features = ["std", "dynload", "syslog", "secure_mem", "fail_delay", "legacy_pamd", "builtin_modules"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
greetd_ipc = { path = "../greetd_ipc", features = ["tokio-codec"] }
inish = { path = "../inish" }
libc = "0.2"
tokio = { version = "1", features = ["net", "sync", "macros", "signal", "rt", "io-util", "time"] }
getopts = "0.2"
thiserror = "1.0"
async-trait = "0.1"
enquote = "1.1"
